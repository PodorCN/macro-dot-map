h"],"basis":"sourced"},{"text":"September Canadian CPI: 3.1% year over year; 2.2% excluding gasoline.","src":["statcan_cpi"],"basis":"sourced"}],"say":"Producer-price inflation remains elevated while survey expectations ease; wages and energy are separate inputs.","tone":"energy"},"issuance":{"label":"AI funding pressure","tag":"CoreWeave debt $46.9B","layer":1,"y":730,"kind":"structural","asOf":"2026-11-12","value":"AI financing needs span debt and equity","facts":[{"text":"Oct 26: Meta announced about $35B of equity offerings and a future $60B at-the-market plan; Nov 3: it said it was raising $15B of bonds for AI infrastructure.","src":["sec_meta","meta_bond"],"basis":"sourced"},{"text":"CoreWeave's Sep 30 debt carrying values totalled $46.873B, rounded to $46.9B: current and non-current recourse plus non-recourse debt, excluding leases.","src":["coreweave_q3"],"basis":"sourced"},{"text":"Nov 10: Anthropic proposed 825M IPO shares at $70–78 each, plus a $26B concurrent private placement conditional on the offering.","src":["anthropic_s1a2"],"basis":"sourced"},{"text":"Counterpoint: Blackstone president Jon Gray said compute demand still ran well ahead of supply; he also said higher capital costs would slow the pace.","src":["ai_finance"],"basis":"sourced"}],"say":"Funding needs can become delivery risk if AI builders cannot raise capital on workable terms.","tone":"ai"},"overcap":{"label":"AI execution risk","tag":"Funding, rules, CEO","layer":1,"y":850,"kind":"structural","asOf":"2026-11-12","value":"Risks to AI construction and NVIDIA execution","facts":[{"text":"Nov 5: investors feared a Democratic-controlled Congress could slow data-center construction, triggering a sharp AI stock selloff.","src":["wrap_nov5"],"basis":"sourced"},{"text":"AP described Huang's departure as leaving NVIDIA facing an uncertain future.","src":["ap_nvda_exit"],"basis":"sourced"},{"text":"NVIDIA's board expects operations, customer commitments and the product roadmap to continue without interruption.","src":["nvda_transition"],"basis":"sourced"},{"text":"Project delays can reduce chip orders; NVIDIA-specific execution risk can affect its valuation without weaker demand across the sector.","src":[],"basis":"unsourced"}],"say":"Track funding and delivery; NVIDIA succession risk does not prove sector-wide demand weakness.","tone":"ai"},"fed":{"label":"Fed","tag":"Hold; hike risk","layer":2,"y":430,"kind":"policy","asOf":"2026-11-12","value":"3.75-4.00% hold; next decision Dec 9","facts":[{"text":"Oct 28: the Fed held at 3.75–4.00%, by a 10–2 vote. Lisa Cook and Beth Hammack preferred a quarter-point increase.","src":["fed_oct"],"basis":"sourced"},{"text":"Nov 12: WSJ reported a Treasury selloff as Fed officials discussed reducing inflation through higher interest rates.","src":["wsj_rates12"],"basis":"sourced"},{"text":"The next scheduled FOMC decision is Dec 9, following the Dec 8–9 meeting.","src":["fed_cal"],"basis":"sourced"},{"text":"September PCE inflation was 3.6% year over year; core PCE was 3.1%. Released Oct 29.","src":["bea_sep"],"basis":"sourced"}],"say":"The Fed held in October; November inflation and rate expectations keep another hike in focus.","tone":"energy"},"y10":{"label":"US 10-yr yield","tag":"5.10% Nov 12","layer":2,"y":670,"kind":"price","asOf":"2026-11-13","value":"10-year Treasury par yield 5.10% on Nov 12","facts":[{"text":"Treasury par curve: Nov 12 10-year 5.10%, compared with 4.98% on Nov 10 and 5.31% on Oct 5.","src":["treasury_par"],"basis":"sourced"},{"text":"Bond supply can pressure yields, while risk-off demand can pull them down; neither channel explains every daily move.","src":[],"basis":"unsourced"}],"say":"The Treasury 10-year par yield rose from 4.98% on Nov 10 to 5.10% on Nov 12.","tone":"duration"},"realy":{"label":"Real yields","tag":"TIPS 2.86% Nov 12","layer":2,"y":850,"kind":"monthly","asOf":"2026-11-13","value":"10-year Treasury real yield 2.86% on Nov 12","facts":[{"text":"Treasury real curve: Nov 12 10-year 2.86%, compared with 2.78% on Nov 10 and 2.95% on Oct 5.","src":["treasury_real"],"basis":"sourced"},{"text":"An asset with no income faces an opportunity cost when real yields rise; haven demand may offset that channel.","src":[],"basis":"unsourced"}],"say":"The Treasury 10-year real yield rose from 2.78% on Nov 10 to 2.86% on Nov 12.","tone":"duration"},"boc":{"label":"Bank of Canada","tag":"2.50% · Oct 28 hike","layer":2,"y":310,"kind":"policy","asOf":"2026-11-06","value":"BoC hiked to 2.50%; October jobless rate 6.7%","facts":[{"text":"Oct 28: the BoC raised its overnight target by 25 bp to 2.50% to reduce the risk that high energy costs spread to other prices.","src":["boc_oct"],"basis":"sourced"},{"text":"The BoC said further increases may be needed but it will proceed carefully. Next scheduled decision: Dec 9.","src":["boc_oct"],"basis":"sourced"},{"text":"Nov 6 release: October employment was little changed (−4,700), while unemployment rose to 6.7% from 6.5%.","src":["ca_jobs"],"basis":"sourced"},{"text":"September CPI was 3.1%, or 2.2% excluding gasoline.","src":["statcan_cpi"],"basis":"sourced"}],"say":"Canada has already hiked, but weaker employment makes the next decision harder.","tone":"labour"},"energy":{"label":"Energy earnings","tag":"Q3 blended EPS growth","layer":3,"y":550,"kind":"monthly","asOf":"2026-11-12","value":"Nov 6: Energy among double-digit Q3 growth leaders","facts":[{"text":"Nov 6 FactSet: Energy was among the double-digit blended Q3 earnings-growth leaders. Overall S&P 500 growth was 31.4%, with 88% reported.","src":["factset_nov6"],"basis":"sourced"}],"say":"Energy led in FactSet's Nov 6 blended Q3 earnings estimate; that is not a current stock return.","tone":"energy"},"gold":{"label":"Gold","tag":"$3,878.40 Nov 12","layer":3,"y":790,"kind":"price","asOf":"2026-11-12","value":"Front-month gold $3,878.40 Nov 12 settlement","facts":[{"text":"Nov 12 front-month Comex gold settled at $3,878.40 per troy ounce, its lowest settlement since Oct 2, 2025.","src":["gold_nov12"],"basis":"sourced"},{"text":"Higher real yields raise the cost of holding gold, but haven demand can offset this channel.","src":[],"basis":"unsourced"}],"say":"Front-month gold settled at $3,878.40 on Nov 12; this is a futures price, not a spot quote.","tone":"energy"},"credit":{"label":"High-yield credit","tag":"HY 3.20%; CCC 13.14%","layer":3,"y":670,"kind":"price","asOf":"2026-11-13","value":"Nov 12 OAS: HY 3.20%; CCC-and-lower 13.14%","facts":[{"text":"Nov 12 ICE BofA high-yield OAS: 3.20%, down from 3.30% on Nov 11.","src":["fred"],"basis":"sourced"},{"text":"Nov 12 ICE BofA CCC-and-lower OAS: 13.14%, down from 13.30% on Nov 11. These are spreads, not all-in borrowing yields.","src":["fred_ccc"],"basis":"sourced"}],"say":"Both broad high-yield and CCC spreads narrowed on Nov 12; high Treasury yields can still keep all-in refinancing costs elevated.","tone":"risk"},"semis":{"label":"Semis & tech","tag":"SOX 10,506.7 Nov 12","layer":3,"y":910,"kind":"weekly","asOf":"2026-11-12","value":"SOX 10,506.7 Nov 12; NVIDIA risk, peers diverge","facts":[{"text":"Nov 12 SOX close: 10,506.7, down 0.54% from 10,564.1 on Nov 11. Values use the displayed precision of Investing.com history.","src":["inv_sox"],"basis":"sourced"},{"text":"Nov 5: SOX fell 12.25%. Reuters linked the AI selloff to fears that the election outcome could slow the data-center build-out.","src":["inv_sox","wrap_nov5"],"basis":"sourced"},{"text":"Nov 12: AP reported other AI chip stocks rose while NVIDIA recovered part of its early loss. The leadership shock did not hit every chipmaker equally.","src":["ap_stocks_nov12"],"basis":"sourced"}],"say":"The SOX and individual chip stocks can diverge; NVIDIA's CEO exit is a company shock.","tone":"ai"},"cad":{"label":"Canadian dollar","tag":"USD/CAD 1.4255","layer":3,"y":310,"kind":"price","asOf":"2026-11-12","value":"BoC daily USD/CAD 1.4255 on Nov 12","facts":[{"text":"Bank of Canada daily rate: USD/CAD 1.4255 on Nov 12, versus 1.4181 on Nov 10.","src":["boc_fx"],"basis":"sourced"},{"text":"The BoC raised rates to 2.50% on Oct 28, but employment was little changed in October and unemployment rose to 6.7%.","src":["boc_oct","ca_jobs"],"basis":"sourced"},{"text":"A higher Canadian rate can support CAD at the margin; US rate expectations and risk appetite can outweigh that support.","src":[],"basis":"unsourced"}],"say":"USD/CAD rose from 1.4181 on Nov 10 to 1.4255 on Nov 12; a higher quote means a weaker loonie.","tone":"labour"},"sbcorr":{"label":"Stock–bond corr.","tag":"Hedge is conditional","layer":4,"y":610,"kind":"monthly","asOf":"2026-11-12","value":"Bonds cushioned the Nov 5 equity selloff","facts":[{"text":"Nov 5: the S&P 500 fell about 4.4% while short Treasury yields fell 12 bp. The curve bull-steepened during the tech selloff.","src":["wrap_nov5"],"basis":"sourced"},{"text":"Apr 8: AQR describes stock-bond correlation as dependent on inflation versus growth uncertainty, rather than a permanent regime.","src":["aqr_conditional"],"basis":"sourced"},{"text":"Nov 12: WSJ reported a Treasury selloff as Fed officials discussed higher interest rates to curb inflation.","src":["wsj_rates12"],"basis":"sourced"},{"text":"These are dated hedge observations, not a new rolling-correlation estimate. Bond protection depends on whether growth risk or inflation dominates.","src":[],"basis":"unsourced"}],"say":"Bonds helped during the equity shock, but strong jobs and inflation can still challenge that hedge.","tone":"risk"},"factor":{"label":"Quality > momentum","tag":"QUAL +0.1% in Oct","layer":4,"y":790,"kind":"monthly","asOf":"2026-11-13","value":"October: QUAL +0.1%; MTUM −10.5%","facts":[{"text":"October ETF returns: iShares MSCI USA Quality Factor (QUAL) +0.1%; iShares MSCI USA Momentum Factor (MTUM) −10.5%, according to FactSet via MarketWatch.","src":["factor_oct"],"basis":"sourced"},{"text":"MarketWatch reported investors favouring low debt and consistent earnings as AI stocks sold off in October.","src":["factor_oct"],"basis":"sourced"}],"say":"Quality held up better than momentum in October; treat that as a dated result, not a permanent relationship.","tone":"risk"},"breadth":{"label":"Equal vs cap weight","tag":"RSP +4.95% in Oct","layer":4,"y":910,"kind":"weekly","asOf":"2026-11-06","value":"October: RSP +4.95%; SPY −0.91% (price returns)","facts":[{"text":"September 30 to October 30 price returns: RSP +4.95% ($208.02 to $218.31); SPY -0.91% ($762.63 to $755.72).","src":["breadth_oct"],"basis":"sourced"},{"text":"24/7 Wall St. put technology near 37% of S&P 500 market value in its Nov 3 report, explaining why tech weakness hurts cap weight more.","src":["breadth_oct"],"basis":"sourced"},{"text":"October leadership is a completed-month comparison, not evidence that every stock held up in the Nov 5 selloff.","src":[],"basis":"unsourced"},{"text":"Nov 3 FactSet blended Q3 growth: Mag 7 22.6%, other 493 32.6%, with five of seven reported. If sustained, it would be their first slower quarter since Q4 2022.","src":["factset_mag7"],"basis":"sourced"}],"say":"Equal weight beat cap weight in October; that reduces concentration but does not remove market risk.","tone":"ai"},"aipolicy":{"label":"AI policy risk","tag":"Nov 5 repricing","layer":0,"y":790,"kind":"event","asOf":"2026-11-06","value":"Investors fear tighter AI infrastructure rules","facts":[{"text":"Nov 5: after the Democratic midterm sweep, investors feared Congress could slow the data-center build-out; the SOX fell about 12%.","src":["wrap_nov5"],"basis":"sourced"},{"text":"This is a market assessment of future regulatory risk, not evidence that a new restriction has already taken effect.","src":[],"basis":"unsourced"}],"say":"The latest AI shock is a possible slowdown in data-center construction, priced before any new rules take effect.","eventDate":"2026-11-05","tone":"ai"},"nvidia":{"label":"NVIDIA CEO resigns","tag":"Announced Nov 12","layer":0,"y":910,"kind":"event","asOf":"2026-11-12","eventDate":"2026-11-12","value":"Nov 12 announcement: Huang out; Kress interim CEO","facts":[{"text":"Nov 12: NVIDIA announced Jensen Huang's departure as CEO, president and director. CFO Colette Kress became interim CEO.","src":["nvda_transition"],"basis":"sourced"},{"text":"The 8-K dates the board's acceptance of the resignation to Nov 11. Nov 12 is the public announcement date.","src":["nvda_8k"],"basis":"sourced"},{"text":"Nov 12: AP reported NVIDIA closed about 4% lower after dropping 14% at the opening bell.","src":["ap_nvda_exit"],"basis":"sourced"},{"text":"NVIDIA kept Nov 17 for its fiscal Q3 2027 results, followed by an earnings call.","src":["nvda_transition"],"basis":"sourced"}],"say":"NVIDIA's CEO exit adds leadership risk; the board expects product plans to continue.","tone":"ai"},"coreweave":{"label":"CoreWeave earnings","tag":"CRWV +24.7% Nov 11","layer":0,"y":670,"kind":"event","asOf":"2026-11-12","eventDate":"2026-11-10","value":"Nov 10 results; CRWV +24.7% on Nov 11","facts":[{"text":"Nov 10: CoreWeave raised 2026 revenue guidance to $13.0–13.3B and guided full-year capex to $37–39B.","src":["coreweave_q3"],"basis":"sourced"},{"text":"Q3 revenue was $3.661B versus $1.365B a year earlier.","src":["coreweave_q3"],"basis":"sourced"},{"text":"Nov 11: CRWV rose 24.7%. Reuters said its report eased concerns about demand supporting debt-funded expansion.","src":["crwv_rally"],"basis":"sourced"}],"say":"CoreWeave's results eased AI demand worries, while financing and construction risks remain.","tone":"ai"},"jobs":{"label":"US jobs surprise","tag":"Oct payrolls +165K","layer":0,"y":190,"kind":"monthly","asOf":"2026-11-13","value":"October payrolls +165,000; unemployment 4.1%","facts":[{"text":"Nov 6 BLS release: October nonfarm payrolls rose 165,000; unemployment was 4.1%.","src":["us_jobs"],"basis":"sourced"},{"text":"Reuters’ Nov 6 poll expected 65,000 new jobs; Treasury yields and the dollar rose after the stronger report.","src":["jobs_reaction"],"basis":"sourced"},{"text":"BLS revised August and September employment up by a combined 84,000.","src":["us_jobs"],"basis":"sourced"},{"text":"Counterpoint: part-time employment for economic reasons rose 339,000 to 4.8M in October.","src":["us_jobs"],"basis":"sourced"}],"say":"Hiring resilience supports income, but the rise in involuntary part-time work tempers the headline.","tone":"labour"},"auction":{"label":"30-year auction","tag":"$25B sold Nov 12","layer":0,"y":310,"kind":"event","asOf":"2026-11-13","value":"Nov 12: $25B auction; high yield 5.441%","facts":[{"text":"Nov 12: Treasury sold $25B of 30-year bonds at a high yield of 5.441%; bid-to-cover was 2.36.","src":["auction_nov12"],"basis":"sourced"},{"text":"The Nov 4 refunding plan offered $125B against about $97B of maturing debt, raising about $28B of new cash. Gross issuance is not all new borrowing.","src":["refunding_nov4"],"basis":"sourced"}],"say":"Auction demand helps price government financing; one auction does not identify the cause of every yield move.","eventDate":"2026-11-12","tone":"duration"},"wages":{"label":"Wage growth","tag":"Oct +3.1% y/y","layer":1,"y":190,"kind":"monthly","asOf":"2026-11-13","value":"October hourly earnings +0.4% m/m; +3.1% y/y","facts":[{"text":"October average hourly earnings for all private nonfarm employees rose 14 cents, or 0.4%, to $38.00; annual growth was 3.1%.","src":["us_jobs"],"basis":"sourced"},{"text":"Firm labour demand can sustain wage pressure, but hiring and pay rising together do not prove one caused the other.","src":[],"basis":"unsourced"},{"text":"Wage growth is a separate input to the policy outlook; productivity, margins and energy prices also affect inflation.","src":[],"basis":"unsourced"}],"say":"Pay growth adds a labour-cost channel to the oil-led inflation story; it is not a forecast of the next Fed vote.","tone":"labour"},"supply":{"label":"Duration supply","tag":"Long debt needs buyers","layer":1,"y":310,"kind":"structural","asOf":"2026-11-13","value":"Investors must absorb long-maturity Treasury risk","facts":[{"text":"Treasury kept nominal coupon auction sizes steady for the coming quarter; bill sizes can adjust to financing needs.","src":["refunding_nov4"],"basis":"sourced"},{"text":"CBO published Treasury duration-supply research on Oct 5 and underlying data on Nov 12; its model finds higher duration supply raises term premiums.","src":["cbo_duration"],"basis":"sourced"},{"text":"Supply effects depend on investor demand and the maturity mix. This is a conditional channel, not an estimated effect of the Nov 12 auction.","src":[],"basis":"unsourced"}],"say":"The maturity mix matters: more interest-rate risk needs buyers, even when auction sizes are unchanged.","tone":"duration"},"front":{"label":"US 2-year yield","tag":"4.86% Nov 12","layer":2,"y":190,"kind":"price","asOf":"2026-11-13","value":"2-year Treasury par yield 4.86% on Nov 12","facts":[{"text":"Treasury par curve: 2-year yield 4.86% on Nov 12, versus 4.73% on Nov 10. This is a market yield, not the Fed policy rate.","src":["treasury_par"],"basis":"sourced"},{"text":"Nov 13 Reuters attributed dollar strength and rising Treasury yields to larger-hike expectations after inflation data and hawkish Fed comments.","src":["usd_nov13"],"basis":"sourced"}],"say":"Short Treasury yields transmit expected policy into currency pricing; expectations can reverse before a meeting.","tone":"labour"},"term":{"label":"Term premium","tag":"Supply + uncertainty","layer":2,"y":550,"kind":"structural","asOf":"2026-11-13","value":"Long yields also price interest-rate uncertainty","facts":[{"text":"The Fed defines the yield term premium as the bond yield minus the expected average short rate over its life. It is estimated, not directly observed.","src":["fed_term"],"basis":"sourced"},{"text":"CBO models Treasury duration supply as one determinant of term premiums. Its research is not a daily decomposition of the Nov 12 selloff.","src":["cbo_duration"],"basis":"sourced"}],"say":"Separate expected policy from compensation for holding duration; a higher long yield need not mean more expected Fed hikes.","tone":"duration"},"usd":{"label":"US dollar","tag":"DXY 103.34 Nov 13","layer":3,"y":190,"kind":"price","asOf":"2026-11-13","value":"Nov 13 intraday dollar index 103.34","facts":[{"text":"Nov 13 Reuters update: the dollar index was 103.34, up 0.1% in that report. This is an intraday observation, not the daily close.","src":["usd_nov13"],"basis":"sourced"},{"text":"Reuters linked dollar firmness to jobs, inflation and hawkish Fed comments. DXY is a currency basket, not a USD/CAD quote.","src":["usd_nov13"],"basis":"sourced"}],"say":"Dollar strength can cushion foreign holdings for a CAD investor, but the relevant exchange rate is USD/CAD.","tone":"labour"},"treasuries":{"label":"Treasury prices","tag":"Rate shock Nov 12","layer":3,"y":430,"kind":"price","asOf":"2026-11-13","value":"Nov 12: Treasury prices fell as yields rose","facts":[{"text":"Nov 12 MarketWatch reported investors selling Treasury notes and bonds as yields rose and prices fell. No single bond-index return is claimed.","src":["bond_prices12"],"basis":"sourced"},{"text":"Treasury par curve: the 30-year yield was 5.43% on Nov 12, versus 5.35% on Nov 10; these are yields, not price returns.","src":["treasury_par"],"basis":"sourced"},{"text":"Higher required yields lower the price of an existing fixed-rate bond, all else equal. Credit safety does not prevent this price risk.","src":["sec_duration"],"basis":"sourced"}],"say":"Treasury credit quality and Treasury price stability are different questions; inflation can still hurt bond prices.","tone":"duration"},"fx":{"label":"USD FX gains","tag":"CAD investor, unhedged","layer":4,"y":250,"kind":"structural","asOf":"2026-11-13","value":"Stronger USD lifts CAD value of unhedged US assets","facts":[{"text":"SEC Investor.gov explains that exchange-rate changes can increase or reduce the return on an international i ,"y10-sbcorr"],"script":"The bond hedge remains conditional. Reported attacks threaten Gulf energy deliveries, and Brent settled at $95.82 on Nov 12. Higher energy costs can feed inflation: October US CPI rose 0.4% on the month. Inflation pressure keeps tightening in focus despite the Fed's October hold. The 10-year Treasury par yield reached 5.10% on Nov 12, which can hurt both bond prices and equity valuations when inflation drives the move. Bonds did cushion the earlier November equity shock, so that episode is not proof of a permanent correlation regime. I would retain a growth-risk hedge while testing renewed oil inflation separately.","topics":["Stock–bond correlation","60/40","Inflation regimes","Duration","Diversification"]},{"key":"gold","name":"Gold: haven versus rate risk","edges":["hormuz-oil","oil-inflation","inflation-fed","fed-realy","realy-gold"],"script":"Gold still faces competing haven and rate forces. Reported Gulf attacks can support oil and headline inflation, keeping pressure on the Fed after its October hold. The 10-year Treasury real yield rose to 2.86% on Nov 12, increasing the opportunity cost of a metal with no income. Front-month gold settled at $3,878.40 that day. This is a dated futures observation, not a spot quote. Haven demand can still offset the rate channel, so neither the price level nor one session proves a stable causal relationship. I would watch real yields and supply-risk headlines together.","topics":["Real yields","Opportunity cost of gold","Safe havens","US dollar"]},{"key":"fund","name":"Who funds the AI build-out?","edges":["aicapex-issuance","issuance-y10","y10-aicapex","issuance-overcap","overcap-semis","y10-semis"],"script":"AI investment needs external capital. Amazon guides roughly $220B of cash capex, while CoreWeave's $46.9B debt carrying value shows financing exposure. Meta and Anthropic illustrate debt and equity funding. More debt competes for capital and can pressure yields. Higher Treasury yields can raise the financing hurdle for planned spending. Funding constraints can also delay capacity, reducing expected chip earnings. Higher discount rates can separately weigh on chip valuations. These are conditional financing and valuation channels, not proof that AI issuance caused a particular daily Treasury move. I would compare debt service and funding terms with cash generation and delivery commitments.","topics":["Term premium","Bond supply","Discount rates","Capex financing"]},{"key":"ai","name":"AI funding, execution and stocks","edges":["issuance-overcap","nvidia-overcap","coreweave-overcap","aipolicy-overcap","overcap-semis","semis-breadth"],"script":"AI risks meet at the ability to fund and deliver capacity. Financing pressure can slow the build-out. NVIDIA's CEO exit adds company execution uncertainty, while CoreWeave's results eased expansion doubts. Feared construction rules add a separate policy risk. Delivery uncertainty can reduce expected chip profits or valuation multiples, which can affect a cap-weighted index more than equal weight. These funding and valuation links are conditional reasoning. NVIDIA's board expects its roadmap to continue, and other chip stocks rose on Nov 12. I would monitor funding access, actual construction rules and succession together before inferring a broad demand decline.","topics":["AI financing","Execution risk","Leadership and policy","Concentration risk","Equal vs cap weight"]},{"key":"canada","name":"Oil's winners and Canada's bind","edges":["oil-energy","oil-inflation","inflation-boc","boc-cad"],"script":"Canada faces energy inflation alongside a weak labour market. Brent rebounded to $95.82 on Nov 12, supporting the producer-earnings channel, although the week was still lower. FactSet placed Energy among the Q3 earnings-growth leaders; that dated blended estimate does not measure current stock performance. Higher energy prices can spread into other prices, which is why the BoC hiked to 2.50%. October unemployment was 6.7%. A higher Canadian rate can support the currency, but relative US expectations can offset it: the BoC daily USD/CAD rate was 1.4255 on Nov 12. I would watch relative policy expectations and oil together rather than treat a Canadian hike as a complete currency signal.","topics":["Stagflation","Central bank policy","Commodity currencies","Sector rotation"]},{"key":"quality","name":"Rotation to quality","edges":["y10-credit","credit-factor","y10-factor"],"script":"Balance-sheet strength matters when refinancing costs stay high. The Treasury 10-year par yield was 5.10% on Nov 12. Broad high-yield OAS narrowed to 3.20%, while CCC-and-lower OAS narrowed to 13.14%; those are spreads, not all-in borrowing yields. Narrowing spreads temper the stress story, but high Treasury yields can still make refinancing expensive. Wider credit spreads, if they return, would further reward low debt and dependable cash generation. October quality returns held up better than momentum for that period. I would assess both the credit-spread channel and direct funding costs without treating an old factor result as today's forecast.","topics":["Credit spreads","Quality factor","Default risk","Refinancing risk"]},{"key":"labour_fx","name":"Jobs, rates and currency returns","edges":["jobs-wages","wages-fed","fed-front","front-usd","usd-fx","cad-fx"],"script":"The labour market adds a second policy channel alongside energy inflation. October payrolls rose 165,000, while annual hourly earnings grew 3.1%. Hiring resilience can support pay pressure, but that causal step is conditional. Persistent wage pressure can keep the Fed focused on inflation. Expected tightening feeds short Treasury yields; the two-year par yield was 4.86% on Nov 12. Higher relative US yields can support the dollar, as Reuters described on Nov 13. USD appreciation against CAD adds to an unhedged Canadian investor's translated US holdings; a stronger CAD reverses that contribution. I would separate the asset return, currency move and hedge before calling the portfolio a winner.","topics":["Labour demand","Wage inflation","Policy expectations","US dollar","Currency translation"]},{"key":"fiscal_duration","name":"Who absorbs Treasury duration?","edges":["auction-supply","supply-term","term-treasuries","y10-treasuries","treasuries-duration"],"script":"Government financing adds duration risk for private investors to absorb. Treasury sold $25B of thirty-year bonds on Nov 12. Auctioned maturity exposure can increase the compensation investors require, although demand and the debt mix can offset supply. Term premium is distinct from the expected policy path; no daily model estimate is claimed here. Higher term compensation can lower existing Treasury prices, and higher market yields have the same inverse-price channel. Treasury prices fell during the Nov 12 rate selloff, but one auction does not prove the whole move's cause. Longer-duration holdings face larger mark-to-market sensitivity. I would distinguish credit safety, duration losses and the conditional growth hedge.","topics":["Treasury auctions","Duration supply","Term premium","Bond prices","Duration risk"]}]};</script>

 const connected=E.filter(e=>e.from===id||e.to===id),es=new Set(connected.map(e=>e.id));
 const ns=new Set([id,...connected.flatMap(e=>[e.from,e.to])]);
 E.forEach(e=>{edgeEl[e.id].classList.remove("preview");edgeEl[e.id].classList.toggle("on",es.has(e.id))});
 Object.keys(N).forEach(k=>{nodeEl[k].classList.toggle("on",ns.has(k));nodeEl[k].classList.toggle("sel",k===id);nodeEl[k].setAttribute("aria-expanded",k===id?"true":"false")});
 connected.forEach(e=>gE.appendChild(edgeGroup[e.id]));
}
function clearHighlight(){svg.classList.remove("has-selection");E.forEach(e=>edgeEl[e.id].classList.remove("on","preview"));Object.values(nodeEl).forEach(g=>{g.classList.remove("on","sel");g.setAttribute("aria-expanded","false")})}
function sourceList(keys){
 const unique=[...new Set(keys)].filter(k=>S[k]);
 return `<ul class="src">${unique.map(k=>`<li><a href="${esc(S[k].url)}" target="_blank" rel="noopener">${esc(S[k].name)}</a>${S[k].tier===3?basis("weak"):""}</li>`).join("")}</ul>`;
}
function setPosition(x,y){
 const r=details.getBoundingClientRect(),gap=14;
 details.style.left=`${Math.max(gap,Math.min(x,innerWidth-r.width-gap))}px`;
 details.style.top=`${Math.max(gap,Math.min(y,innerHeight-r.height-gap))}px`;
}
function placeDetails(){
 if(details.hidden)return;
 const r=details.getBoundingClientRect();
 if(moved){setPosition(r.left,r.top);return}
 const gap=14;
 const boxes=Object.entries(nodeEl).map(([id,node])=>{const b=node.getBoundingClientRect();return {id,rect:{x:b.x-6,y:b.y-6,left:b.left-6,top:b.top-6,right:b.right+6,bottom:b.bottom+6,width:b.width+12,height:b.height+12}}});
 const anchor=boxes.find(b=>b.id===selected).rect;
 const candidates=[];
 const around=b=>candidates.push([b.right+12,b.top],[b.left-r.width-12,b.top],[b.left,b.bottom+12],[b.right-r.width,b.bottom+12],[b.left,b.top-r.height-12],[b.right-r.width,b.top-r.height-12]);
 around(anchor);
 candidates.push([innerWidth-r.width-gap,gap],[gap,gap],[innerWidth-r.width-gap,innerHeight-r.height-gap],[gap,innerHeight-r.height-gap]);
 if(!details.classList.contains("expanded"))boxes.forEach(b=>{if(b.rect.right>0&&b.rect.left<innerWidth&&b.rect.bottom>0&&b.rect.top<innerHeight)around(b.rect)});
 const clamped=candidates.map(([x,y])=>[Math.max(gap,Math.min(x,innerWidth-r.width-gap)),Math.max(gap,Math.min(y,innerHeight-r.height-gap))]);
 const neighbors=new Set(E.filter(e=>e.from===selected||e.to===selected).flatMap(e=>[e.from,e.to]));
 const labels=[...svg.querySelectorAll(".colhead,.colnum,.column-caption,.map-name,.map-description,.map-date")].map(e=>e.getBoundingClientRect());
 const matrix=svg.getScreenCTM(),activePoints=[];
 E.filter(e=>e.from===selected||e.to===selected).forEach(e=>{
  const path=edgeEl[e.id],length=path.getTotalLength();
  for(let i=0;i<=32;i++){const p=path.getPointAtLength(length*i/32);activePoints.push(new DOMPoint(p.x,p.y).matrixTransform(matrix))}
 });
 const score=([x,y],i)=>{
  let weight=i*.001+Math.hypot(x+r.width/2-anchor.x-anchor.width/2,y+r.height/2-anchor.y-anchor.height/2)*.001;
  boxes.forEach(({id,rect:b})=>{
   const overlap=Math.max(0,Math.min(x+r.width,b.right)-Math.max(x,b.left))*Math.max(0,Math.min(y+r.height,b.bottom)-Math.max(y,b.top));
   if(overlap>.1)weight+=(1+overlap/Math.max(1,b.width*b.height))*(id===selected?10000:neighbors.has(id)?1000:40);
  });
  labels.forEach(b=>{const overlap=Math.max(0,Math.min(x+r.width,b.right)-Math.max(x,b.left))*Math.max(0,Math.min(y+r.height,b.bottom)-Math.max(y,b.top));if(overlap>.1)weight+=2+overlap/Math.max(1,b.width*b.height)});
  return weight;
 };
 const best=clamped.map((p,i)=>({p,score:score(p,i)+activePoints.filter(q=>q.x>=p[0]&&q.x<=p[0]+r.width&&q.y>=p[1]&&q.y<=p[1]+r.height).length*.3})).sort((a,b)=>a.score-b.score)[0].p;
 setPosition(...best);
}
function setExpanded(expanded){
 details.classList.toggle("expanded",expanded);document.getElementById("detail-body").hidden=!expanded;
 const toggle=document.getElementById("toggle-details");toggle.textContent=expanded?"Collapse":"Read details";toggle.setAttribute("aria-expanded",String(expanded));
 document.getElementById("window-label").textContent=expanded?"DETAILS":"SUMMARY";panel.scrollTop=0;
}
function openNode(id,expanded=false){
 const n=N[id];if(!n)return;selected=id;highlight(id);details.className=`details tone-${n.tone}`;
 const incoming=E.filter(e=>e.to===id),outgoing=E.filter(e=>e.from===id);
 const links=(edges,inbound)=>edges.length?`<ul class="links">${edges.map(e=>{const other=inbound?e.from:e.to;return `<li><button type="button" data-node-link="${esc(other)}">${esc(N[other].label)}</button> <span class="direction">${e.sign==="+"?"same direction":"opposite direction"}</span>${basis(e.basis)}<p>${esc(e.why)}</p></li>`}).join("")}</ul>`:"";
 panel.innerHTML=`<div><p class="detail-meta"><span class="detail-stage">${esc(LY.layers[n.layer])} / ${esc(topic[n.tone])}</span>Snapshot ${date(M.asOf)}<br>Verified ${date(n.asOf)}</p><h2 id="detail-title" tabindex="-1">${esc(n.label)}</h2><p class="value">${esc(n.value)}</p></div>
 <div class="detail-body" id="detail-body" hidden><div><h3>Facts</h3><ul>${n.facts.map(f=>`<li>${esc(f.text)}${basis(f.basis)}</li>`).join("")}</ul></div>
 ${incoming.length?`<div><h3>Driven by</h3>${links(incoming,true)}</div>`:""}
 ${outgoing.length?`<div><h3>Drives</h3>${links(outgoing,false)}</div>`:""}
 <p class="read-through">${esc(n.say)}</p><div><h3>Sources</h3>${sourceList(n.facts.flatMap(f=>f.src).concat([...incoming,...outgoing].flatMap(e=>e.src)))}</div></div>`;
 panel.querySelectorAll("[data-node-link]").forEach(b=>b.onclick=()=>openNode(b.dataset.nodeLink,true));
 details.hidden=false;setExpanded(expanded);placeDetails();document.getElementById("detail-title").focus({preventScroll:true});
}
function closeDetails(){const id=selected;selected=null;moved=false;drag=null;details.hidden=true;clearHighlight();if(id)nodeEl[id].focus({preventScroll:true})}
document.getElementById("toggle-details").onclick=()=>{setExpanded(!details.classList.contains("expanded"));placeDetails()};
document.getElementById("close-details").onclick=closeDetails;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!details.hidden){e.preventDefault();closeDetails()}});
const handle=document.getElementById("move-details");
handle.addEventListener("pointerdown",e=>{if(e.button!==0)return;const r=details.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};handle.setPointerCapture(e.pointerId);e.preventDefault()});
handle.addEventListener("pointermove",e=>{if(!drag)return;moved=true;setPosition(drag.left+e.clientX-drag.x,drag.top+e.clientY-drag.y)});
handle.addEventListener("pointerup",()=>drag=null);handle.addEventListener("pointercancel",()=>drag=null);
handle.addEventListener("keydown",e=>{const delta={ArrowLeft:[-24,0],ArrowRight:[24,0],ArrowUp:[0,-24],ArrowDown:[0,24]}[e.key];if(!delta)return;e.preventDefault();moved=true;const r=details.getBoundingClientRect();setPosition(r.left+delta[0],r.top+delta[1])});
addEventListener("resize",()=>{if(!details.hidden)placeDetails()});
</script>
</body>
</html>
