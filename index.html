.links{list-style:none;padding:0;gap:12px}
.links button{font:700 14px/1.4 var(--f-sans);color:var(--ink);text-align:left;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.links p{margin:4px 0 0;font:13px/1.55 var(--f-sans);color:var(--body)}
.direction{font:11px var(--f-mono);color:var(--mut)}
.read-through{margin:0;padding:12px;background:var(--soft);font:15px/1.6 var(--f-body)}

","why":"CoreWeave's results eased doubts about demand supporting its AI expansion.","src":["crwv_rally"],"basis":"sourced","signAt":0.25,"d":"M186 210 C204 210 204 470 222 470","sx":199.0,"sy":273.8},{"id":"issuance-overcap","from":"issuance","to":"overcap","sign":"+","why":"Funding constraints can delay planned AI capacity.","basis":"unsourced","src":[],"d":"M310 356 C310 376 310 424 310 442","sx":310.0,"sy":399.0},{"id":"nvidia-overcap","from":"nvidia","to":"overcap","sign":"+","why":"Huang's departure leaves NVIDIA facing company execution uncertainty.","basis":"sourced","src":["ap_nvda_exit"],"d":"M186 410 C204 410 204 470 222 470","sx":204.0,"sy":440.0}],"chains":[{"key":"bonds","name":"Is the bond hedge back?","edges":["hormuz-oil","oil-inflation","inflation-fed","fed-y10","y10-sbcorr"],"script":"The bond hedge remains conditional. Reported attacks threaten Gulf energy deliveries, and Brent settled at $95.82 on Nov 12. Higher energy costs can feed inflation: October US CPI rose 0.4% on the month. Inflation pressure keeps tightening in focus despite the Fed's October hold. The 10-year Treasury par yield reached 5.10% on Nov 12, which can hurt both bond prices and equity valuations when inflation drives the move. Bonds did cushion the earlier November equity shock, so that episode is not proof of a permanent correlation regime. I would retain a growth-risk hedge while testing renewed oil inflation separately.","topics":["Stock–bond correlation","60/40","Inflation regimes","Duration","Diversification"]},{"key":"gold","name":"Gold: haven versus rate risk","edges":["hormuz-oil","oil-inflation","inflation-fed","fed-realy","realy-gold"],"script":"Gold still faces competing haven and rate forces. Reported Gulf attacks can support oil and headline inflation, keeping pressure on the Fed after its October hold. The 10-year Treasury real yield rose to 2.86% on Nov 12, increasing the opportunity cost of a metal with no income. Front-month gold settled at $3,878.40 that day. This is a dated futures observation, not a spot quote. Haven demand can still offset the rate channel, so neither the price level nor one session proves a stable causal relationship. I would watch real yields and supply-risk headlines together.","topics":["Real yields","Opportunity cost of gold","Safe havens","US dollar"]},{"key":"fund","name":"Who funds the AI build-out?","edges":["aicapex-issuance","issuance-y10","y10-aicapex","issuance-overcap","overcap-semis","y10-semis"],"script":"AI investment needs external capital. Amazon guides roughly $220B of cash capex, while CoreWeave's $46.9B debt carrying value shows financing exposure. Meta and Anthropic illustrate debt and equity funding. More debt competes for capital and can pressure yields. Higher Treasury yields can raise the financing hurdle for planned spending. Funding constraints can also delay capacity, reducing expected chip earnings. Higher discount rates can separately weigh on chip valuations. These are conditional financing and valuation channels, not proof that AI issuance caused a particular daily Treasury move. I would compare debt service and funding terms with cash generation and delivery commitments.","topics":["Term premium","Bond supply","Discount rates","Capex financing"]},{"key":"ai","name":"AI funding, execution and stocks","edges":["issuance-overcap","nvidia-overcap","coreweave-overcap","aipolicy-overcap","overcap-semis","semis-breadth"],"script":"AI risks meet at the ability to fund and deliver capacity. Financing pressure can slow the build-out. NVIDIA's CEO exit adds company execution uncertainty, while CoreWeave's results eased expansion doubts. Feared construction rules add a separate policy risk. Delivery uncertainty can reduce expected chip profits or valuation multiples, which can affect a cap-weighted index more than equal weight. These funding and valuation links are conditional reasoning. NVIDIA's board expects its roadmap to continue, and other chip stocks rose on Nov 12. I would monitor funding access, actual construction rules and succession together before inferring a broad demand decline.","topics":["AI financing","Execution risk","Leadership and policy","Concentration risk","Equal vs cap weight"]},{"key":"canada","name":"Oil's winners and Canada's bind","edges":["oil-energy","oil-inflation","inflation-boc","boc-cad"],"script":"Canada faces energy inflation alongside a weak labour market. Brent rebounded to $95.82 on Nov 12, supporting the producer-earnings channel, although the week was still lower. FactSet placed Energy among the Q3 earnings-growth leaders; that dated blended estimate does not measure current stock performance. Higher energy prices can spread into other prices, which is why the BoC hiked to 2.50%. October unemployment was 6.7%. A higher Canadian rate can support the currency, but relative US expectations can offset it: the BoC daily USD/CAD rate was 1.4255 on Nov 12. I would watch relative policy expectations and oil together rather than treat a Canadian hike as a complete currency signal.","topics":["Stagflation","Central bank policy","Commodity currencies","Sector rotation"]},{"key":"quality","name":"Rotation to quality","edges":["y10-credit","credit-factor","y10-factor"],"script":"Balance-sheet strength matters when refinancing costs stay high. The Treasury 10-year par yield was 5.10% on Nov 12. Broad high-yield OAS narrowed to 3.30% on Nov 11, but CCC-and-lower OAS rose to 13.30%; those are spreads, not all-in borrowing yields. Higher refinancing costs can make low debt and dependable cash generation more valuable. October equity returns support that preference for that period: quality was roughly flat while momentum lost over 10%. I would apply the same discipline across credit and equities without assuming every quality stock is cheap or using an old factor return as today's forecast.","topics":["Credit spreads","Quality factor","Default risk","Refinancing risk"]}]};</script>
<script>

svg.setAttribute("viewBox",`0 0 ${LY.viewBox[0]} ${LY.viewBox[1]}`);

[["ah","arrow"],["ahOn","arrow-on"]].forEach(([id,c])=>{const m=mk("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);mk("path",{d:"M0,1 L9,5 L0,9 z",class:c},m)});

});
const gE=mk("g"),gS=mk("g"),gN=mk("g"),edgeEl={},signEl={},nodeEl={};

let selected=null;
function highlight(id){
  const connected=E.filter(e=>e.from===id||e.to===id),es=new Set(connected.map(e=>e.id));

  connected.forEach(e=>gE.appendChild(edgeEl[e.id]));
}
function clearHighlight(){

  panel.innerHTML=`<div><p class="detail-meta">${esc(LY.layers[n.layer])} · Snapshot ${date(M.asOf)}<br>Verified ${date(n.asOf)}</p><h2 id="detail-title" tabindex="-1">${esc(n.label)}</h2><p class="value">${esc(n.value)}</p></div>
    <div><h3>Facts</h3><ul>${n.facts.map(f=>`<li>${esc(f.text)}${basis(f.basis)}</li>`).join("")}</ul></div>
    ${incoming.length?`<div><h3>Driven by</h3>${links(incoming,true)}</div>`:""}
    ${outgoing.length?`<div><h3>Drives</h3>${links(outgoing,false)}</div>`:""}
    <p class="read-through">${esc(n.say)}</p>
    <div><h3>Sources</h3>${sourceList(n.facts.flatMap(f=>f.src).concat([...incoming,...outgoing].flatMap(e=>e.src)))}</div>`;
  panel.querySelectorAll("[data-node-link]").forEach(b=>b.onclick=()=>openNode(b.dataset.nodeLink));
  details.hidden=false;workspace.classList.add("has-details");
  nodeEl[id].scrollIntoView({block:"nearest",inline:"nearest"});
  panel.scrollTop=0;document.getElementById("detail-title").focus({preventScroll:true});
}
function closeDetails(){const id=selected;selected=null;details.hidden=true;workspace.classList.remove("has-details");clearHighlight();if(id)nodeEl[id].focus({preventScroll:true})}
document.getElementById("close-details").onclick=closeDetails;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!details.hidden){e.preventDefault();closeDetails()}});
</script>
</body>
</html>
