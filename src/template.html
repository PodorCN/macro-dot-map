<meta charset="utf-8">
<title>Macro Dot Map</title>
<meta name="macro-dot-map:content-hash" content="__CONTENT_HASH__">
<style>
:root{
  --paper:#ffffff; --ink:#111111; --mut:#6b7280; --body:#374151; --line:#e3e3e3; --line-2:#d1d5db;
  --soft:#f6f6f4; --red:#e51503; --up:#0a7d44; --warn:#b45309;
  --edge:#b4bcc8; --hot:#111827; --hot-fg:#ffffff; --mast:#000000; --mast-fg:#ffffff; --mast-mut:#9ca3af;
  --f-display:Georgia,"Times New Roman","Songti SC",serif;
  --f-body:Georgia,"Times New Roman","Songti SC",serif;
  --f-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut-l:max(clamp(16px,3vw,56px),env(safe-area-inset-left,0px));
  --gut-r:max(clamp(16px,3vw,56px),env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1013; --ink:#ececea; --mut:#9ca3af; --body:#c9ccd1; --line:#24282e; --line-2:#3a3f47;
  --soft:#171a1f; --red:#ff4b3a; --up:#3fbf7f; --warn:#e0a54a;
  --edge:#4b5563; --hot:#f3f4f6; --hot-fg:#0e1013; --mast:#000000; --mast-fg:#ffffff; --mast-mut:#9ca3af; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1013; --ink:#ececea; --mut:#9ca3af; --body:#c9ccd1; --line:#24282e; --line-2:#3a3f47;
  --soft:#171a1f; --red:#ff4b3a; --up:#3fbf7f; --warn:#e0a54a;
  --edge:#4b5563; --hot:#f3f4f6; --hot-fg:#0e1013; --mast:#000000; --mast-fg:#ffffff; --mast-mut:#9ca3af; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

html,body{width:100%;height:100%;overflow:hidden}
.map-canvas{position:fixed;inset:0;padding:12px;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom}
svg.map{display:block;width:100%;height:100%;min-width:980px}
.colnum{font:700 10.5px var(--f-mono);letter-spacing:.14em;fill:var(--red)}
.colhead{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;fill:var(--mut)}
.colrule{stroke:var(--line-2);stroke-width:1}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .15s,stroke .15s}
.edge.unsourced{stroke-dasharray:3 4}
.edge.on{stroke:var(--hot);stroke-width:2.4}
.sign circle{fill:var(--paper);stroke:var(--edge);stroke-width:1.2}
.sign text{font:700 11px var(--f-mono);fill:var(--mut);text-anchor:middle;dominant-baseline:central}
.sign.on circle{stroke:var(--hot)} .sign.on text{fill:var(--ink)}
.node{cursor:pointer;transition:opacity .15s}
.node rect.box{fill:var(--paper);stroke:var(--line-2);stroke-width:1.2}
.node:hover rect.box{stroke:var(--ink)}
.node.on rect.box{stroke:var(--hot);stroke-width:2}
.node .nl{font:700 13px var(--f-sans);fill:var(--ink)}
.node .nt{font:400 10.5px var(--f-mono);fill:var(--mut)}
.node.sel rect.box{fill:var(--hot);stroke:var(--hot)}
.node.sel .nl,.node.sel .nt{fill:var(--hot-fg)} .node.sel .nt{opacity:.75}
.dim{opacity:.2} .node.dim{opacity:.35}
.arrow{fill:var(--edge)} .arrow-on{fill:var(--hot)}
.node:focus-visible rect.box{stroke:var(--red);stroke-width:2.5}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
/* Details are part of the map interaction and stay hidden until a node is opened. */
dialog{width:min(540px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;padding:24px;background:var(--paper);color:var(--ink);border:1px solid var(--line-2);overflow:auto;overscroll-behavior:contain;box-shadow:0 14px 70px #0003}
dialog::backdrop{background:#0005}
.close{position:absolute;right:12px;top:10px;display:grid;place-items:center;width:32px;height:32px;font:24px/1 var(--f-sans);border:0;background:var(--soft);color:var(--ink);cursor:pointer}
#panel{display:grid;gap:20px}
.detail-meta{margin:0;padding-right:28px;font:11px/1.6 var(--f-mono);color:var(--mut)}
h2{font:700 28px/1.15 var(--f-display);margin:8px 0 0;text-wrap:balance}
.value{font:700 15px/1.5 var(--f-sans);margin:10px 0 0}
h3{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
ul{margin:0;padding-left:18px;display:grid;gap:10px;color:var(--body)}
.tag{display:inline-block;font:700 9px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--mut);padding:1px 5px;margin-left:6px;white-space:nowrap}
.tag.sourced{color:var(--up);border-color:currentColor}
.tag.unsourced{border-style:dashed}
.tag.weak{border-color:var(--warn);color:var(--warn)}
.links{list-style:none;padding:0;gap:12px}
.links button{font:700 14px/1.4 var(--f-sans);color:var(--ink);text-align:left;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.links p{margin:4px 0 0;font:13px/1.55 var(--f-sans);color:var(--body)}
.direction{font:11px var(--f-mono);color:var(--mut)}
.read-through{margin:0;padding:12px;background:var(--soft);font:15px/1.6 var(--f-body)}
.src{list-style:none;padding:0;gap:0}
.src li{font:12px/1.5 var(--f-sans);border-bottom:1px solid var(--line);padding:7px 0}
.src a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
@media(max-width:759px){.map-canvas{padding:8px}dialog{padding:20px}h2{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<main class="map-canvas" id="map-canvas" aria-label="Macro transmission map">
  <svg class="map" id="map" role="group" aria-label="Current market drivers and their transmission links"></svg>
</main>
<dialog id="details" aria-labelledby="detail-title">
  <button class="close" id="close-details" type="button" aria-label="Close details">×</button>
  <div id="panel"></div>
</dialog>

<script>const DATA=/*__DATA__*/null;</script>
<script>
const {layout:LY,nodes:N,edges:E,sources:S,meta:M}=DATA;
const W=LY.nodeW,H=LY.nodeH,NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map"),dialog=document.getElementById("details"),panel=document.getElementById("panel");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const num=i=>String(i+1).padStart(2,"0");
const basis=b=>`<span class="tag ${b}">${{sourced:"sourced",weak:"verify",unsourced:"unsourced"}[b]}</span>`;
const mk=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
svg.setAttribute("viewBox",`0 0 ${LY.viewBox[0]} ${LY.viewBox[1]}`);
const defs=mk("defs");
[["ah","arrow"],["ahOn","arrow-on"]].forEach(([id,c])=>{const m=mk("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);mk("path",{d:"M0,1 L9,5 L0,9 z",class:c},m)});
LY.layers.forEach((label,i)=>{
  const x=LY.columns[i],t=mk("text",{x,y:LY.headerY,class:"colhead","text-anchor":"middle"});
  const n=mk("tspan",{class:"colnum"},t);n.textContent=num(i)+"  ";t.appendChild(document.createTextNode(label));
  mk("line",{x1:x-W/2,x2:x+W/2,y1:LY.headerY+9,y2:LY.headerY+9,class:"colrule"});
});
const gE=mk("g"),gS=mk("g"),gN=mk("g"),edgeEl={},signEl={},nodeEl={};
E.forEach(e=>{
  edgeEl[e.id]=mk("path",{d:e.d,class:"edge"+(e.basis==="unsourced"?" unsourced":""),"data-edge":e.id,"marker-end":"url(#ah)"},gE);
  const g=mk("g",{class:"sign"},gS);mk("circle",{cx:e.sx,cy:e.sy,r:9},g);
  mk("text",{x:e.sx,y:e.sy+.5},g).textContent=e.sign;signEl[e.id]=g;
});
Object.entries(N).forEach(([id,n])=>{
  const x=LY.columns[n.layer],y=n.y;
  const g=mk("g",{class:"node","data-node":id,tabindex:"0",role:"button","aria-label":n.label,"aria-haspopup":"dialog"},gN);
  mk("rect",{class:"box",x:x-W/2,y:y-H/2,width:W,height:H,rx:1},g);
  mk("text",{x:x-W/2+12,y:y-4,class:"nl"},g).textContent=n.label;
  mk("text",{x:x-W/2+12,y:y+14,class:"nt"},g).textContent=n.tag;
  g.addEventListener("click",()=>openNode(id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openNode(id)}});
  nodeEl[id]=g;
});
let selected=null;
function highlight(id){
  const connected=E.filter(e=>e.from===id||e.to===id),es=new Set(connected.map(e=>e.id));
  const ns=new Set([id,...connected.flatMap(e=>[e.from,e.to])]);
  E.forEach(e=>{const on=es.has(e.id);edgeEl[e.id].classList.toggle("on",on);edgeEl[e.id].classList.toggle("dim",!on);signEl[e.id].classList.toggle("on",on);signEl[e.id].classList.toggle("dim",!on);edgeEl[e.id].setAttribute("marker-end",on?"url(#ahOn)":"url(#ah)")});
  Object.keys(N).forEach(k=>{nodeEl[k].classList.toggle("on",ns.has(k));nodeEl[k].classList.toggle("dim",!ns.has(k));nodeEl[k].classList.toggle("sel",k===id)});
  connected.forEach(e=>gE.appendChild(edgeEl[e.id]));
}
function clearHighlight(){
  E.forEach(e=>{edgeEl[e.id].classList.remove("on","dim");signEl[e.id].classList.remove("on","dim");edgeEl[e.id].setAttribute("marker-end","url(#ah)")});
  Object.values(nodeEl).forEach(g=>g.classList.remove("on","dim","sel"));
}
function sourceList(keys){
  const unique=[...new Set(keys)].filter(k=>S[k]);
  return `<ul class="src">${unique.map(k=>`<li><a href="${esc(S[k].url)}" target="_blank" rel="noopener">${esc(S[k].name)}</a>${S[k].tier===3?basis("weak"):""}</li>`).join("")}</ul>`;
}
function openNode(id){
  const n=N[id];if(!n)return;selected=id;highlight(id);
  const incoming=E.filter(e=>e.to===id),outgoing=E.filter(e=>e.from===id);
  const links=(edges,inbound)=>edges.length?`<ul class="links">${edges.map(e=>{const other=inbound?e.from:e.to;return `<li><button type="button" data-node-link="${esc(other)}">${esc(N[other].label)}</button> <span class="direction">${e.sign} · ${e.sign==="+"?"same direction":"opposite direction"}</span>${basis(e.basis)}<p>${esc(e.why)}</p></li>`}).join("")}</ul>`:"";
  panel.innerHTML=`<div><p class="detail-meta">${esc(LY.layers[n.layer])} · Snapshot ${date(M.asOf)}<br>Verified ${date(n.asOf)}</p><h2 id="detail-title" tabindex="-1">${esc(n.label)}</h2><p class="value">${esc(n.value)}</p></div>
    <div><h3>Facts</h3><ul>${n.facts.map(f=>`<li>${esc(f.text)}${basis(f.basis)}</li>`).join("")}</ul></div>
    ${incoming.length?`<div><h3>Driven by</h3>${links(incoming,true)}</div>`:""}
    ${outgoing.length?`<div><h3>Drives</h3>${links(outgoing,false)}</div>`:""}
    <p class="read-through">${esc(n.say)}</p>
    <div><h3>Sources</h3>${sourceList(n.facts.flatMap(f=>f.src).concat([...incoming,...outgoing].flatMap(e=>e.src)))}</div>`;
  panel.querySelectorAll("[data-node-link]").forEach(b=>b.onclick=()=>openNode(b.dataset.nodeLink));
  nodeEl[id].scrollIntoView({block:"nearest",inline:"nearest"});
  if(!dialog.open)dialog.showModal();
  dialog.scrollTop=0;document.getElementById("detail-title").focus({preventScroll:true});
}
document.getElementById("close-details").onclick=()=>dialog.close();
dialog.addEventListener("close",()=>{const id=selected;selected=null;clearHighlight();if(id)nodeEl[id].focus({preventScroll:true})});
dialog.addEventListener("click",e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
</script>
